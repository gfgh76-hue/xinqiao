            --primary-light: #3b3b3b;
            --shadow-page: inset 20px 0 50px rgba(0,0,0,0.5);
        }

	}


        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { margin: 0; padding: 0; font-family: var(--font-main); background-color: var(--bg-body); overflow: hidden; height: 100vh; color: var(--text-main); }
        button { cursor: pointer; border: none; outline: none; font-family: inherit; }

        /* --- 1. 首页入口 (Home View) --- */
        #home-view {

        #home-view.hidden { transform: translateY(-100%); pointer-events: none; }

        .hero-card {
            background: rgba(255,255,255,0.95); width: 800px; height: 450px;

        }
        .hero-cover {
            width: 40%; background: linear-gradient(to bottom right, #8e44ad, #c0392b);
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
            position: relative;
        }
        .hero-cover::after { content: ''; position: absolute; right: 0; top:0; width: 10px; height:100%; background: linear-gradient(to right, transparent, rgba(0,0,0,0.2)); }

        .hero-tag { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; width: fit-content; margin-bottom: 15px; }
        .hero-title { font-size: 32px; font-weight: 800; margin: 0 0 15px 0; color: #2c3e50; line-height: 1.2; }
        .hero-desc { color: #7f8c8d; line-height: 1.6; margin-bottom: 30px; font-size: 15px; }
        .hero-stats { display: flex; gap: 20px; margin-bottom: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .stat-item strong { display: block; font-size: 18px; color: #333; }
        .stat-item span { font-size: 12px; color: #999; }
        
        .btn-group { display: flex; gap: 15px; }
        .btn-primary { flex: 1; background: var(--primary); color: white; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; box-shadow: 0 5px 15px rgba(142, 68, 173, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(142, 68, 173, 0.4); }
        .btn-secondary { flex: 1; background: transparent; border: 2px solid #eee; color: #666; padding: 13px; border-radius: 10px; font-weight: bold; }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        /* --- 2. 阅读器容器 (Reader View) --- */
        #reader-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; opacity: 0; transition: opacity 0.5s 0.3s;
            pointer-events: none; /* 初始不可点 */
        }
        #reader-view.active { opacity: 1; pointer-events: all; }

        /* 顶部工具栏 */
        .toolbar-top {
            height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px;
            background: var(--bg-body); z-index: 5;
        }
        .toolbar-title { font-weight: bold; color: var(--text-main); }
        .tool-icons i { margin-left: 20px; font-style: normal; font-size: 18px; color: var(--text-main); opacity: 0.6; cursor: pointer; }
        .tool-icons i:hover { opacity: 1; color: var(--primary); }

        /* 书本舞台 */
        .book-stage {
            flex: 1; display: flex; justify-content: center; align-items: center; perspective: 2000px;
            padding: 20px; overflow: hidden;
        }

        /* 3D 书本核心 */
        .book {
            width: var(--book-width); height: var(--book-height); position: relative;
            transform-style: preserve-3d;
        }

        /* 纸张 */
        .paper {
    width: 50%; height: 100%; position: absolute; top: 0;
    right: 0; /* ✅ 改成：靠右 */
    transform-origin: left center; /* ✅ 改成：轴心在左（书脊） */
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
    background: var(--bg-paper);
    border-radius: 0 5px 5px 0; /* ✅ 改成：圆角在右侧 */
    z-index: 1;
}
        /* 封面/右页初始位置 */
        .paper.flipped { transform: rotateY(-180deg); z-index: 2; }
        
        /* 页面正反面 */
        .front, .back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; background: var(--bg-paper);
            box-shadow: var(--shadow-page); padding: 40px; overflow: hidden;
        }
        .front { z-index: 2; }
        .back { 
    transform: rotateY(180deg); 
    z-index: 1; 
    border-radius: 5px 0 0 5px; /* ✅ 改成：圆角在左 */
    border-right: 1px solid rgba(0,0,0,0.1); /* ✅ 改成：书脊线在右 */
    /* 删掉 border-left，或者设为 none */
    border-left: none; 
    /* ✅ 新增：修正阴影方向（负数代表从右边往左投射） */
    box-shadow: inset -20px 0 50px rgba(0,0,0,0.05); 
}

        /* 内容样式 */
        .page-num { position: absolute; bottom: 20px; color: var(--text-light); font-size: 12px; width: 100%; text-align: center; left: 0;}
        .page-content h2 { color: var(--primary); border-bottom: 2px solid var(--primary-light); padding-bottom: 10px; margin-top: 0; }
        .page-content p { line-height: 1.8; color: var(--text-main); font-size: 15px; }
        
        /* 词条样式 */
        .term-tag { display: inline-block; background: #e0f7fa; color: #006064; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; }
        .chat-bubble {
            background: var(--primary-light); padding: 15px; border-radius: 15px; border-bottom-left-radius: 2px;
            margin: 15px 0; font-size: 14px; position: relative; color: var(--text-main);
        }
        .chat-bubble::before { content: '💬 例句'; display: block; font-size: 10px; color: var(--primary); margin-bottom: 5px; font-weight: bold; }
        
        .risk-alert { border-left: 3px solid #e74c3c; background: #fadbd8; padding: 10px; font-size: 13px; color: #c0392b; margin-top: 10px; }

        /* 底部控制栏 */
        .toolbar-bottom {
            height: 60px; padding: 0 50px; display: flex; justify-content: center; align-items: center; gap: 20px;
            background: var(--bg-body); z-index: 5;
        }
        .progress-bar-container { width: 300px; height: 4px; background: #ddd; border-radius: 2px; position: relative; cursor: pointer; }

        .ctrl-btn { width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--primary); font-weight: bold; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 目录抽屉 */
        /* 抽屉遮罩 */
        .drawer-backdrop{
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 90;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s;
        }
        .drawer-backdrop.open{ opacity: 1; pointer-events: auto; }

        /* 搜索 UI */
        .search-box{ display:flex; gap:10px; margin: 10px 0 8px; }
        .search-input{
            flex:1; padding: 10px 12px; border-radius: 10px;

        .search-results{ display:flex; flex-direction:column; gap:8px; }
        .search-item{
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.6);
            cursor: pointer;
        }
        .search-item:hover{ background: var(--primary-light); }
        .search-item .si-title{ font-size: 14px; font-weight: 700; margin-bottom: 6px; }
        .search-item .si-meta{ font-size: 12px; color: var(--text-light); display:flex; gap:8px; flex-wrap:wrap; }
        .search-item .si-snippet{ font-size: 12px; color: var(--text-main); opacity: 0.9; margin-top: 6px; line-height: 1.4; }
        .pill{
            display:inline-flex; align-items:center; gap:6px;
            font-size: 12px; padding: 2px 10px; border-radius: 999px;
            background: rgba(142,68,173,0.12); color: var(--primary);
        }

        /* 更完整的暗色模式（覆盖变量） */
        body.dark-mode{
            --bg-body: #0b1220;
            --bg-paper: #121a2b;

        .drawer {

        .drawer.open { transform: translateX(0); }
        .drawer h3 { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-top: 0; }
        .toc-item { padding: 12px 10px; border-bottom: 1px solid #f5f5f5; cursor: pointer; font-size: 14px; color: var(--text-main); }

        @media (max-width: 768px) {

    </style>

            },
            {

              tag: '追星文化',
              def: '指自称粉丝但不为偶像花钱、不做数据的粉丝',

              example: '以最低成本享受追星乐趣，但可能在圈内受到压力，需平衡投入与收获'
            },
            {
              type: 'term',

              tag: '追星文化',
              def: '指粉丝为支持偶像而进行的各种活动，如购买专辑、参加活动、制作应援物等',
              usage: '源自日韩粉丝文化，现已成全球粉丝常见行为',
              example: '通过集体行动表达对偶像的支持，获得参与感和集体荣誉感'
            },
            {
              type: 'end',
              title: '封底',
              content: '<p>感谢阅读。</p><p style=\'color:#666\'>建议家长与孩子共同维护更新，把“听不懂”变成“聊得来”。</p>'
            }
        ];

        // --- 状态管理 ---
        let currentPage = 1; // 当前显示的右页索引 (1, 3, 5...)
        const totalPages = bookData.length; // 简化处理，每条数据占一页（正或反）
        // 实际上为了双页效果，我们需要把数据映射到物理纸张上
        // 物理纸张数 = Math.ceil(Data.length / 2)
        
        const bookContainer = document.getElementById('book-container');
        const papers = [];

        // --- 初始化渲染 ---
        function applyMeta() {
            // 文档标题
            const t = document.getElementById('doc-title');
            if (t) t.textContent = BOOK_META.docTitle;

            // 顶部标题
            const tt = document.getElementById('toolbar-title');
            if (tt) tt.textContent = BOOK_META.appTitle;

            // 首页信息
            const tag = document.getElementById('hero-tag');
            if (tag) tag.textContent = BOOK_META.heroTag;

            const ht = document.getElementById('hero-title');
            if (ht) ht.innerHTML = BOOK_META.heroTitleHtml;

            const hd = document.getElementById('hero-desc');
            if (hd) hd.textContent = BOOK_META.heroDesc;

            const hv = document.getElementById('hero-version');
            if (hv) hv.textContent = BOOK_META.versionText;

            // 统计：可自动计算
            let stats = BOOK_META.stats || [];
            if (BOOK_META.autoStats) {
                const chapterCount = bookData.filter(x => x.type === 'chapter').length;
                const termCount = bookData.filter(x => x.type === 'term').length;
                stats = [
                    { strong: `${chapterCount} 章`, span: '章节' },
                    { strong: `${termCount}+`, span: '词条' },
                    ...(stats.slice(2) || [])
                ];
            }

            const s1 = document.getElementById('stat-1-strong'); const s1b = document.getElementById('stat-1-span');
            const s2 = document.getElementById('stat-2-strong'); const s2b = document.getElementById('stat-2-span');
            const s3 = document.getElementById('stat-3-strong'); const s3b = document.getElementById('stat-3-span');

            if (stats[0] && s1 && s1b) { s1.textContent = stats[0].strong; s1b.textContent = stats[0].span; }
            if (stats[1] && s2 && s2b) { s2.textContent = stats[1].strong; s2b.textContent = stats[1].span; }
            if (stats[2] && s3 && s3b) { s3.textContent = stats[2].strong; s3b.textContent = stats[2].span; }
        }

        function initBook() {
            bookContainer.innerHTML = '';
            const totalSheets = Math.ceil(bookData.length / 2);
            
            // 生成物理纸张
            for (let i = 0; i < totalSheets; i++) {
                const dataLeft = bookData[i * 2];     // 偶数索引是左页（但在上一张纸的背面）或 封面背面
                const dataRight = bookData[i * 2 + 1]; // 奇数索引是右页（当前纸正面）

                // 注意：Web 3D 书本逻辑通常是：
                // Sheet 1: Front -> Page 1 (Right), Back -> Page 2 (Left of next spread)
                // 这里为了简化，我们采用：Sheet i 的 Front 是第 2i+1 页内容，Back 是第 2i+2 页内容
                // 翻页逻辑：Current Sheet 翻过去，展示 Back，同时露出 Next Sheet 的 Front
                
                const zIndex = totalSheets - i;
                const paper = document.createElement('div');
                paper.className = 'paper';
                paper.style.zIndex = zIndex;
                paper.id = `sheet-${i}`;

                // 正面 (Front) - 对应数据索引 2i+1 (因为第一页通常是右页)
                // 修正：通常 Book[0] 是封面(Right)，Book[1]是封面背(Left)... 
                // 让我们重新定义：Book View 初始状态是合上的？还是打开的？
                // 需求是“打开手册”后进入阅读，建议默认展示 打开状态 (Left: Intro, Right: Chapter 1)
                // 简单起见，我们把 bookData 仅仅看作一连串内容。
                // Sheet 0: Front(Index 0), Back(Index 1)
                
                const frontContent = renderPageContent(bookData[i * 2] || {type:'empty'});
                const backContent = renderPageContent(bookData[i * 2 + 1] || {type:'empty'});

                paper.innerHTML = `
                    <div class="front">
                        <div class="page-content">${frontContent}</div>
                        <div class="page-num">${i * 2 + 1}</div>
                    </div>
                    <div class="back">
                        <div class="page-content">${backContent}</div>
                        <div class="page-num">${i * 2 + 2}</div>
                    </div>
                `;
                
                // 点击翻页交互
                paper.addEventListener('click', () => {
                    // 如果这张纸还没翻过去，就翻过去（Next）
                    // 如果已经翻过去了，点击就翻回来（Prev）- 这里为了简单，统一由按钮控制，
                    // 点击纸张区域只做 Next
                    if(!paper.classList.contains('flipped')) {
                        turnPage('next');
                    } else {
                        turnPage('prev');
                    }
                });

                bookContainer.appendChild(paper);
                papers.push(paper);
            }

            // 初始化目录
            const tocList = document.getElementById('toc-list');
            bookData.forEach((item, index) => {
                if (['chapter', 'term'].includes(item.type)) {
                    const div = document.createElement('div');
                    div.className = 'toc-item';
                    div.innerText = (item.type === 'chapter' ? '📂 ' : '📄 ') + item.title;
                    div.onclick = () => jumpToPage(index);
                    tocList.appendChild(div);
                }
            });

            applyMeta();
            updateStatus();
        }

        // --- 内容渲染器 ---
        function renderPageContent(item) {
            if (item.type === 'empty') return '';
            if (item.type === 'cover') return `<div style="display:flex;justify-content:center;align-items:center;height:100%;"><h1>${item.title}</h1></div>`;
            
            if (item.type === 'chapter') {
                return `
                    <div style="text-align:center; padding-top:100px;">
                        <h1 style="color:var(--primary);font-size:36px;">${item.title}</h1>
                        <p style="color:#666;margin-top:20px;">${item.desc}</p>
                        <div style="margin-top:50px;border-top:1px solid #ddd;width:50px;margin-left:auto;margin-right:auto;"></div>
                    </div>
                `;
            }

            if (item.type === 'term') {
                return `
                    <span class="term-tag">${item.tag}</span>
                    <h2 style="font-size:28px; margin-top:10px;">${item.title}</h2>
                    <p><strong>【现象释义】</strong>${item.def}</p>
                    <p><strong>【文化溯源】</strong>${item.usage}</p>
                    <div class="chat-bubble"><strong>【心理需求】</strong>${item.example}</div>
                    ${item.risk ? `<div class="risk-alert">⚠️ 风险提示：${item.risk}</div>` : ''}
                `;
            }

            return `<h2>${item.title}</h2><div>${item.content || ''}</div>`;
        }

        // --- 核心翻页逻辑 ---
        let currentSheetIndex = -1; // -1 表示书是合上的（或者都在右边）

        function turnPage(direction) {
            if (direction === 'next') {
                if (currentSheetIndex < papers.length - 1) {
                    currentSheetIndex++;
                    const paper = papers[currentSheetIndex];
                    paper.classList.add('flipped');
                    // z-index 调整：翻过去的纸，顺序要倒过来，保证最后翻的在最上面
                    paper.style.zIndex = currentSheetIndex + 1; 
                }
            } else if (direction === 'prev') {
                if (currentSheetIndex >= 0) {
                    const paper = papers[currentSheetIndex];
                    paper.classList.remove('flipped');
                    // z-index 恢复：未翻的纸，index越小越在上面（模拟书页堆叠）
                    setTimeout(() => {
                        paper.style.zIndex = papers.length - currentSheetIndex;
                    }, 300); // 延迟等到动画过半
                    currentSheetIndex--;
                }
            }
            applyMeta();
            updateStatus();
        }

        function jumpToPage(dataIndex) {
            // 计算需要翻多少张纸
            // dataIndex 0,1 -> Sheet 0
            // dataIndex 2,3 -> Sheet 1
            const targetSheet = Math.floor(dataIndex / 2);
            
            // 自动翻页动画
            // 简单实现：瞬间跳转或快速循环
            // 这里演示瞬间逻辑
            papers.forEach((p, idx) => {
                if (idx <= targetSheet) {
                    p.classList.add('flipped');
                    p.style.zIndex = idx + 1;
                } else {
                    p.classList.remove('flipped');
                    p.style.zIndex = papers.length - idx;
                }
            });
            currentSheetIndex = targetSheet;
            updateStatus();
            closeAllDrawers(); // 关闭目录/搜索
        }

        function updateStatus() {
            // 更新进度条和页码
            // currentSheetIndex 是翻过去的纸张数。
            // 比如 index=0翻过去，显示的是 Back(Page 2) 和 Sheet 1 的 Front(Page 3)
            const displayedPage = Math.max(1, (currentSheetIndex + 1) * 2); 
            const total = bookData.length;
            const progress = (displayedPage / total) * 100;
            
            document.getElementById('progress-fill').style.width = `${Math.min(progress, 100)}%`;
            document.getElementById('page-num-display').innerText = `${Math.min(displayedPage, total)} / ${total}`;
            
            // 更新章节标题
            const currentData = bookData[Math.min(displayedPage, total - 1)];
            document.getElementById('chapter-info').innerText = currentData ? currentData.title : '阅读中...';

            saveProgress();
}

        // --- 视图切换 ---
function openBook() {
    const home = document.getElementById('home-view');
    const reader = document.getElementById('reader-view');

    // 先让阅读器参与布局，否则某些浏览器第一次进阅读器会卡一下
    reader.style.display = 'flex';

    // 下一帧再激活 opacity 动画，避免强制同步重排
    requestAnimationFrame(() => {
        home.classList.add('hidden');
        reader.classList.add('active');
    });
}

function closeBook() {
    closeAllDrawers();
    const home = document.getElementById('home-view');
    const reader = document.getElementById('reader-view');

    // 立刻把阅读器从布局树里拿掉（解决“返回首页卡一下”）
    reader.classList.remove('active');
    reader.style.display = 'none';

    // 显示模块首页
    home.classList.remove('hidden');
}


        // =========================
// 目录 / 搜索抽屉：统一控制
// =========================
const drawerBackdrop = document.getElementById('drawer-backdrop');
const tocDrawer = document.getElementById('toc-drawer');
const searchDrawer = document.getElementById('search-drawer');

function openDrawer(which){
    // 先全关
    tocDrawer.classList.remove('open');
    searchDrawer.classList.remove('open');

    if(which === 'toc') tocDrawer.classList.add('open');
    if(which === 'search') searchDrawer.classList.add('open');

    const anyOpen = tocDrawer.classList.contains('open') || searchDrawer.classList.contains('open');
    drawerBackdrop.classList.toggle('open', anyOpen);

    // 打开搜索时自动聚焦
    if(which === 'search'){
        setTimeout(() => document.getElementById('search-input')?.focus(), 50);
    }
}
function closeAllDrawers(){ openDrawer(null); }

function toggleTOC(){
    const isOpen = tocDrawer.classList.contains('open');
    openDrawer(isOpen ? null : 'toc');
}
function toggleSearch(){
    const isOpen = searchDrawer.classList.contains('open');
    openDrawer(isOpen ? null : 'search');
    // 打开搜索抽屉时立刻渲染一次结果（解决未输入时/刚打开无反应的感受）
    if(!isOpen){
        try{ performSearch(); }catch(e){}
    }
}

    const saved = localStorage.getItem('ebook_theme') || 'light';
    document.body.classList.toggle('dark-mode', saved === 'dark');

    const isDark = document.body.classList.contains('dark-mode');

// =========================
// 阅读进度：继续阅读（localStorage）
// =========================
const PROGRESS_KEY = 'ebook_lastSheetIndex';

function saveProgress(){
    // currentSheetIndex: -1 表示合上/封面状态；不写入进度（避免“空记录”）
    if(currentSheetIndex < 0) return;
    localStorage.setItem(PROGRESS_KEY, String(currentSheetIndex));
    refreshContinueButton();
}

function getSavedSheet(){
    const raw = localStorage.getItem(PROGRESS_KEY);
    const n = raw === null ? null : Number(raw);
    if(n === null || Number.isNaN(n) || n < 0) return null;
    // 上限保护
    return Math.min(n, papers.length - 1);
}

function refreshContinueButton(){
    const btn = document.getElementById('continue-btn');
    if(!btn) return;

    const saved = getSavedSheet();
    if(saved === null){
        btn.disabled = true;
        btn.style.opacity = 0.6;
        btn.textContent = '↪ 继续阅读';
        return;
    }
    btn.disabled = false;
    btn.style.opacity = 1;
    const pageNo = Math.max(1, (saved + 1) * 2);
    btn.textContent = `↪ 继续阅读（第 ${pageNo} 页）`;
}

function continueReading(){
    const saved = getSavedSheet();
    if(saved === null){
        alert('你还没有阅读记录。先点“打开手册”开始阅读～');
        return;
    }
    openBookAtSheet(saved);
}

function openBookAtSheet(sheetIndex){
    openBook();
    // 等阅读器视图激活后再跳转（避免某些浏览器动画/渲染时序问题）
    setTimeout(() => {
        // 用 jumpToPage(dataIndex) 跳；dataIndex = sheetIndex*2
        jumpToPage(sheetIndex * 2);
        saveProgress();
    }, 50);
}

// =========================
// 搜索：词条/释义/溯源/心理需求 全文检索
// =========================
function normalize(s){
    return (s || '').toString().toLowerCase().replace(/\s+/g,'');
}

function buildSnippet(item, q){
    const fields = [
        item.title, item.tag,
        item.def, item.usage, item.example,
        item.desc, item.content
    ].filter(Boolean).join('  ');
    const plain = fields.replace(/<[^>]+>/g,' ');
    const idx = plain.toLowerCase().indexOf(q.toLowerCase());
    if(idx === -1) return plain.slice(0, 60);
    const start = Math.max(0, idx - 18);
    const end = Math.min(plain.length, idx + q.length + 30);
    return (start>0 ? '…' : '') + plain.slice(start, end) + (end<plain.length ? '…' : '');
}

function performSearch(){
    const input = document.getElementById('search-input');
    const qRaw = input?.value || '';
    const q = normalize(qRaw);
    const resultsEl = document.getElementById('search-results');
    const hintEl = document.getElementById('search-hint');
    if(!resultsEl) return;

    resultsEl.innerHTML = '';
    if(!q){
        hintEl.textContent = '提示：支持模糊匹配；回车可定位到第一条结果。';
        return;
    }

    const matches = [];
    bookData.forEach((item, index) => {
        if(item.type === 'empty') return;
        const hay = normalize(
            [item.title, item.tag, item.def, item.usage, item.example, item.desc, item.content].filter(Boolean).join(' ')
        );
        if(hay.includes(q)){
            matches.push({ item, index });
        }
    });

    hintEl.textContent = matches.length ? `找到 ${matches.length} 条结果：点击可跳转` : '没有找到结果，换个关键词试试。';

    matches.slice(0, 80).forEach(({item, index}) => {
        const div = document.createElement('div');
        div.className = 'search-item';

        const pageNo = Math.max(1, (Math.floor(index/2) + 1) * 2);
        const typePill = item.type === 'chapter' ? '📂 章节' : (item.type === 'term' ? '📄 词条' : '📄 页面');
        const tag = item.tag ? `<span class="pill">${item.tag}</span>` : '';

        div.innerHTML = `
          <div class="si-title">${item.title || '(未命名)'} ${tag}</div>
          <div class="si-meta"><span class="pill">${typePill}</span> <span class="pill">第 ${pageNo} 页</span></div>
          <div class="si-snippet">${buildSnippet(item, qRaw)}</div>
        `;
        div.onclick = () => {
            if(!document.getElementById('reader-view').classList.contains('active')){
                openBookAtSheet(Math.floor(index/2));
            }else{
                jumpToPage(index);
                saveProgress();
            }
            closeAllDrawers();
        };
        resultsEl.appendChild(div);
    });
}

function clearSearch(){
    const input = document.getElementById('search-input');
    if(input) input.value = '';
    performSearch();
    input?.focus();
}

// 绑定搜索输入事件 + 快捷键
function initSearch(){
    const input = document.getElementById('search-input');
    if(!input) return;

    input.addEventListener('input', () => performSearch());
    input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
            const first = document.querySelector('#search-results .search-item');
            first?.click();
        }
    });

    document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape') closeAllDrawers();
        if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
            e.preventDefault();
            openDrawer('search');
            try{ performSearch(); }catch(e){}
        }
    });
}
// --- 启动 ---
        initBook();
        applyThemeFromStorage();
        initSearch();
        refreshContinueButton();
